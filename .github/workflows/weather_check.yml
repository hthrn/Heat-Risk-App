name: Negros Oriental Heat Index Bulletin

on:
  schedule:
    # Runs every 3 hours (Cron syntax in UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Heat Risk Script
        run: python heat_monitor.py
